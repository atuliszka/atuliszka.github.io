<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agatio Games</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #111827, #1f2937);
      color: #f9fafb;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 680px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(4px);
    }
    h1 { margin: 0 0 10px; font-size: 2rem; }
    p { margin: 0.5rem 0; line-height: 1.5; color: #d1d5db; }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Agatio Games</h1>
    <p>Solo indie studio by one developer, building mobile games that are fun and easy to pick up.</p>
    <p>More games and updates coming soon.</p>
    <p><a href="https://play.google.com/store/apps/developer?id=Agatio+Games">Google Play</a></p>
  </main>
</body>
</html>
